plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    flatDir { dir 'libs' }                    // MCEF (LGPL), compile-time only: libs/mcef-2.1.6-1.20.1.jar; the game gets it from the player's mods folder
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly fg.deobf('blank:mcef:2.1.6-1.20.1')
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_id, 'Specification-Vendor': mod_authors, 'Specification-Version': '1',
                'Implementation-Title'  : project.name, 'Implementation-Version': project.jar.archiveVersion, 'Implementation-Vendor': mod_authors,
        ])
    }
}
jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
