modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="aipconsole"
version="${file.jarVersion}"
displayName="ForgeAIP Console"
description='''
The work console (bots, pits, tags) inside the game: a key (F12 by default) opens it in a full-screen web view (MCEF), and the Tag Tool item
(shift + right-click on a block) opens its Tags page for that block. Needs MCEF on the client; the server only needs this jar (the item).
'''
authors="ForgeAIP"

[[dependencies.aipconsole]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.aipconsole]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.aipconsole]]
    modId="mcef"
    mandatory=true
    versionRange="[2.1.6,)"
    ordering="NONE"
    side="CLIENT"
