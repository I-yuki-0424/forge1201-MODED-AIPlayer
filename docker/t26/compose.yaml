# T26 test worlds (docs/implemented/TEST-WORLDS-T26.md): Fabric 26.1.2 servers, one per number N, each a NEW random seed on `up.sh N --new`.
# Bots speak 26.1 natively (mineflayer 4.39, protocol 775); ViaVersion lets the owner's 26.3 client join to watch. Normal difficulty, no keepInventory.
# Mods: docker/t26/mods.lock.json (sha512), synced to /mnt/data/forgeaip-play/t26/mods by scripts/t26/mods.sh, mounted read-only.
# Port: 100.77.246.23:(25590+N) on the tailnet for the owner's client only (rootless docker cannot bind loopback and the tailnet address on one port); the harness joins the compose network. RCON stays inside the compose network.
name: forgeaip-t26-${N:?use scripts/t26/up.sh N}

services:
  mc:
    image: itzg/minecraft-server@sha256:7d4a888284c2f8d468f620f2534de648cb8eacba48df8d4d20b6ad1ef201f3a3   # :java25, 2026-11-11
    container_name: forgeaip-t26-${N}
    restart: "no"
    stop_grace_period: 60s
    mem_limit: ${MEM_LIMIT:-4g}          # several crews on one world (scripts/t26/multi.sh): more
    cpus: ${CPUS:-2}
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: "26.1.2"
      MEMORY: ${HEAP:-3000M}
      USE_AIKAR_FLAGS: "true"
      LEVEL_TYPE: minecraft:normal
      SEED: ${SEED:-}
      MODE: survival
      DIFFICULTY: normal
      # no OPS: the image would resolve the name at Mojang; up.sh writes ops.json (the owner Seia_Y, offline-mode UUID) before the first start
      OP_PERMISSION_LEVEL: "4"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      MAX_PLAYERS: "30"
      ONLINE_MODE: "false"
      ENFORCE_SECURE_PROFILE: "false"
      ALLOW_FLIGHT: "true"
      MAX_TICK_TIME: "-1"
      PAUSE_WHEN_EMPTY_SECONDS: "0"          # 26.x pauses an empty server: a test would start on a frozen world
      NETWORK_COMPRESSION_THRESHOLD: "256"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?run up.sh}
      MOTD: "forgeaip T26 test world ${N} (Fabric 26.1.2, random seed)"
      REMOVE_OLD_MODS: "false"
      SKIP_SERVER_PROPERTIES: "false"
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 300s
    volumes:
      - data:/data
      - /mnt/data/forgeaip-play/t26/mods:/mods:ro
      - ${REPO:?}/docker/t26/dev.sc:/dev-app/dev.sc:ro       # the in-game /dev command (scarpet, carpet mod); up.sh copies it into world/scripts (a mount there makes world/ root-owned)
    ports:
      - "100.77.246.23:${PORT}:25565"
    networks: [net]

networks:
  net:
    name: forgeaip-t26-${N}_net
volumes:
  data:
    name: forgeaip-t26-${N}_data
