# The owner's creative standing server of the current test-world profile and its work console (TASK-20261125-074; the 26.x one is /mnt/data/fabric26-worlds, kept as it is).
# Started by scripts/t26/creative.sh up (it exports the profile's image, version and mods and the RCON secret). Seed 1359280 as the 26.x creative world; operator only Seia_Y
# (ops.json with the offline-mode UUID, written by creative.sh before the first start: the image's OPS would resolve the name at Mojang).
# Tailnet address only: game 100.77.246.23:25620, console 100.77.246.23:3034 (docker publishes past ufw: check `ss -ltn` after a change). RCON stays on the compose network.
# restart: unless-stopped, so both come back after a reboot of the host (the rootless docker daemon starts at boot).
name: fabric121-worlds

services:
  creative:
    image: ${TW_IMAGE:?use scripts/t26/creative.sh}
    container_name: fabric121-creative
    restart: unless-stopped
    stop_grace_period: 60s
    logging: { driver: json-file, options: { max-size: "50m", max-file: "3" } }
    mem_limit: 4g
    cpus: 2
    environment:
      EULA: "TRUE"
      TYPE: FABRIC
      VERSION: ${TW_MC:?}
      MEMORY: 3000M
      USE_AIKAR_FLAGS: "true"
      LEVEL_TYPE: minecraft:normal
      SEED: "1359280"
      MODE: creative
      FORCE_GAMEMODE: "true"
      DIFFICULTY: normal
      OP_PERMISSION_LEVEL: "4"
      VIEW_DISTANCE: "10"
      SIMULATION_DISTANCE: "8"
      MAX_PLAYERS: "30"
      ONLINE_MODE: "false"
      ENFORCE_SECURE_PROFILE: "false"
      ALLOW_FLIGHT: "true"
      MAX_TICK_TIME: "-1"
      PAUSE_WHEN_EMPTY_SECONDS: "0"
      NETWORK_COMPRESSION_THRESHOLD: "256"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?missing .env}
      MOTD: "Fabric ${TW_MC} creative (seed 1359280)"
      REMOVE_OLD_MODS: "true"
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 300s
    volumes:
      - creative_data:/data
      - ${TW_MODS:?}:/mods:ro
    ports: [ "100.77.246.23:25620:25565" ]

  console-creative:
    image: ${NODE_IMG:?}
    container_name: fabric121-console-creative
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
    working_dir: /app
    mem_limit: 2g
    cpus: 2
    entrypoint: ["node", "src/work/console.js"]
    depends_on:
      creative: { condition: service_healthy }
    environment:
      MC_HOST: creative
      MC_PORT: "25565"
      MC_VERSION: ${TW_BOT:?}
      BOT_REGISTRY: vanilla
      BOT_MOD_TABLE: /work/none.json
      RCON_HOST: creative
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD:?missing .env}
      NODE_OPTIONS: --max-old-space-size=1536
      WORK_DATA: /work
      WORK_BIND: 0.0.0.0           # inside the container; published on the tailnet address only
      WORK_PORT: "3020"
      WORK_MAX_BOTS: "24"
      WORK_WORLD: /world/world     # the world folder itself: the map view reads either version's layout (src/work/world/maps.js)
      WORK_ASSETS: /mc-assets      # the game's pictures for the inventory view (TASK-20261125-077), per game version
      WORK_MC_VERSION: ${TW_MC:?}
    volumes:
      - creative_data:/world:ro
      - ${AIP_REPO:-/home/coder/projects/forge1201-MODED-AIPlayer}:/app:ro
      - /mnt/data/forgeaip-play/creative121/console-data/creative:/work
      - /mnt/data/forgeaip/mc-assets:/mc-assets:ro
    ports: [ "100.77.246.23:3034:3020" ]

volumes:
  creative_data:
    name: fabric121-worlds_creative_data
