# docker/world-server/compose.yaml
#
# The persistent build world (TASK-20261031-019): a modded Forge 1.20.1 server the owner joins to build test sites
# (ladders, water, mod blocks, animals), and disposable copies of it for bots and benchmarks.
#   scripts/world/up.sh                 start the build world (127.0.0.1:25567; the tailnet reaches it on :25565)
#   scripts/world/snapshot.sh <label>   consistent snapshot to /mnt/data/forgeaip/snapshots (hourly automatic ones too)
#   scripts/world/test-up.sh <snap>     disposable copy on 127.0.0.1:25568 (tmpfs: nothing a bot does reaches the build)
#   scripts/world/restore.sh <snap>     roll the build world back to a snapshot (takes a snapshot of the current state first)
#
# Rules: published on 127.0.0.1 only (Docker bypasses ufw); the owner's route is `tailscale serve` (tailnet only, like
# SSH). RCON stays inside the compose network. The world lives in the named volume `data` (on the data disk with the
# rest of coder's Docker data); mods come read-only from /mnt/data/forgeaip/mods, synced from modpack/forgeaip-create.lock.json.
# Design: docs/implemented/WORLD-v1.md.

name: forgeaip-world

x-server: &server
  # Same pinned image as docker/rl-server (2026-10-30, java17 tag).
  image: itzg/minecraft-server@sha256:a08cd9ced3e1c3f46a318af1fa393de21698afbf8746681f115dc923ba847ba5
  stop_grace_period: 60s
  environment: &env
    EULA: "TRUE"
    TYPE: FORGE
    VERSION: "1.20.1"
    FORGE_VERSION: "47.4.10"
    MEMORY: "3G"
    USE_AIKAR_FLAGS: "true"
    # Mods: the lock file's server jars (scripts/world/up.sh), mirrored into /data/mods on every start.
    COPY_MODS_SRC: /mods
    REMOVE_OLD_MODS: "true"
    # Terrain of a newly generated world (scripts/world/reset.sh writes these to .env); an existing world keeps its own.
    LEVEL_TYPE: ${WORLD_LEVEL_TYPE:-flat}
    SEED: ${WORLD_SEED:-20261031}
    GENERATE_STRUCTURES: "false"
    MODE: creative
    FORCE_GAMEMODE: "false"
    DIFFICULTY: easy
    # Animals stay when spawned by egg (with spawn-animals=false 1.20.1 discards every animal); natural spawning is off
    # through the doMobSpawning gamerule (scripts/world/up.sh), so a built scene stays as it was built.
    SPAWN_ANIMALS: "true"
    SPAWN_MONSTERS: "true"
    SPAWN_NPCS: "true"
    ALLOW_NETHER: "true"
    SPAWN_PROTECTION: "0"
    VIEW_DISTANCE: "8"
    SIMULATION_DISTANCE: "6"
    MAX_PLAYERS: "16"
    # Bots have no Microsoft account. Who can connect is decided by the network: loopback + the owner's tailnet.
    ONLINE_MODE: "false"
    ALLOW_FLIGHT: "true"
    ENFORCE_SECURE_PROFILE: "false"
    MAX_TICK_TIME: "-1"
    ENABLE_COMMAND_BLOCK: "true"
    ENABLE_RCON: "true"
    RCON_PASSWORD: ${RCON_PASSWORD:?run scripts/world/up.sh (creates docker/world-server/.env)}
    MOTD: "forgeaip build world"
    LOG_TIMESTAMP: "true"
  healthcheck:
    test: ["CMD", "mc-health"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 240s
  networks: [world]

services:
  world:
    <<: *server
    container_name: forgeaip-world
    restart: unless-stopped
    mem_limit: 4g
    cpus: 3
    volumes:
      - data:/data
      - /mnt/data/forgeaip/mods:/mods:ro
      - /mnt/data/forgeaip/snapshots:/snapshots
    ports:
      - "127.0.0.1:25567:25565"

  # A disposable copy: unpacks SNAPSHOT into a tmpfs world at start. Nothing written here survives the container.
  world-test:
    <<: *server
    profiles: [test]
    container_name: forgeaip-world-test
    restart: "no"
    mem_limit: 4g
    cpus: 3
    entrypoint: ["/bin/sh", "-c", "set -e; tar -xzf \"/snapshots/$${SNAPSHOT:?}\" -C /data; chown -R 1000:1000 /data/world; exec /start"]
    environment:
      <<: *env
      SNAPSHOT: ${SNAPSHOT:-}
    volumes:
      - test-data:/data
      - /mnt/data/forgeaip/mods:/mods:ro
      - /mnt/data/forgeaip/snapshots:/snapshots:ro
    tmpfs:
      - /data/world:size=1024m,uid=1000,gid=1000,mode=0755
    ports:
      - "127.0.0.1:25568:25565"

  # One-shot: the lock's server jars + tools/registry-dump on a tmpfs copy of SNAPSHOT; writes /data/registry.json and
  # stops (scripts/world/registry-dump.sh copies it to modpack/). No port: nothing connects to it.
  registry-dump:
    <<: *server
    profiles: [dump]
    container_name: forgeaip-registry-dump
    restart: "no"
    mem_limit: 4g
    cpus: 3
    entrypoint: ["/bin/sh", "-c", "set -e; tar -xzf \"/snapshots/$${SNAPSHOT:?}\" -C /data; chown -R 1000:1000 /data/world; exec /start"]
    environment:
      <<: *env
      SNAPSHOT: ${SNAPSHOT:-}
      MODS: /tool/forgeaip-registrydump-1.0.0.jar
      FORGEAIP_DUMP: /data/registry.json
      FORGEAIP_DUMP_HALT: "1"
    volumes:
      - test-data:/data
      - /mnt/data/forgeaip/mods:/mods:ro
      - /mnt/data/forgeaip/snapshots:/snapshots:ro
      - ../../tools/registry-dump/build/libs:/tool:ro
    tmpfs:
      - /data/world:size=1024m,uid=1000,gid=1000,mode=0755

  # Live check of the LLM path on the new action layer against the test copy (scripts/skills/intent_check.js).
  intent-check:
    image: node@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    profiles: [check]
    working_dir: /app
    mem_limit: 768m
    cpus: 1
    environment:
      MC_HOST: world-test
      MC_PORT: "25565"
      RCON_PASSWORD: ${RCON_PASSWORD:?run scripts/world/up.sh}
      BOT_RUNTIME: skills
    volumes:
      - ../..:/app:ro
      - check-logs:/app/logs
    tmpfs:
      - /tmp
    entrypoint: ["node", "scripts/skills/intent_check.js"]
    networks: [world]

  # The LLM-driven bot (index.js: AgentManager + skills_bot) in the build world. LLM endpoint and key from the vault
  # (config/vault-llm.conf -> record ollama/forgeaip). WebUI unauthenticated: loopback only (docs/LESSONS.md L3).
  llm-bot:
    image: node@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    profiles: [bot]
    container_name: forgeaip-llm-bot
    restart: unless-stopped
    working_dir: /app
    mem_limit: 768m
    cpus: 1
    depends_on:
      world:
        condition: service_healthy
    environment:
      MC_HOST: world
      MC_PORT: "25565"
      BOT_NAMES: ${LLM_BOT_NAMES:-AI_Bot_01}
      BOT_RUNTIME: skills
      VAULT_CONF: /run/vault-llm.conf
      WEBUI_PORT: "3000"
    volumes:
      - ../..:/app
      - ../../config/vault-llm.conf:/run/vault-llm.conf:ro
    ports:
      - "127.0.0.1:3020:3000"     # host 3000 is the honeypot Grafana
    entrypoint: ["node", "index.js"]
    networks: [world]

  # The action-layer benchmark (scripts/skills/bench.js) against the build world, so the owner can watch it in game.
  # Natural terrain: --ground auto puts the arena next to the world spawn on dry land at the measured surface height.
  bench:
    image: node@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    profiles: [bench]
    working_dir: /app
    mem_limit: 2g          # up to 10 bots in one process (scripts/skills/bench_lv2.js --bots)
    cpus: 2
    environment:
      MC_HOST: world
      MC_PORT: "25565"
      RCON_HOST: world
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD:?run scripts/world/up.sh}
      BOT_REGISTRY: auto
    volumes:
      - ../..:/app:ro
      - ../../exchange:/exchange
    entrypoint: ["node", "scripts/skills/bench.js"]
    networks: [world]

  # ---- RL training (docs/proposed/RL-TRAINING-v2.md, scripts/train/*.sh) --------------------------------------------
  # The training world takes the build world's place on 127.0.0.1:25567, so the owner watches it over the same tailnet
  # route (100.115.238.9:25565) and no new listener exists; scripts/train/up.sh stops the build world first (memory).
  # Survival, normal difficulty, structures (strongholds, fortresses, monuments, villages), natural spawning, day cycle.
  train: &train
    <<: *server
    profiles: [train]
    container_name: forgeaip-train
    restart: unless-stopped
    mem_limit: ${TRAIN_MEM_LIMIT:-4g}
    cpus: 3
    environment: &trainenv
      <<: *env
      # Heap per server: 3G alone; 2G each when several shards share the box (scripts/train/up.sh --shards).
      MEMORY: ${TRAIN_MEMORY:-3G}
      LEVEL_TYPE: minecraft:normal
      SEED: ${TRAIN_SEED:-20261101}
      GENERATE_STRUCTURES: "true"
      MODE: survival
      FORCE_GAMEMODE: "false"
      DIFFICULTY: normal
      ALLOW_NETHER: "true"
      ALLOW_FLIGHT: "true"
      MOTD: "forgeaip RL training world"
      # Bots act within about 20 blocks: a smaller ticking area is less work per tick, and per-tick work is the budget that
      # bots x speed share (one server thread). The owner still sees 6 chunks when watching.
      SIMULATION_DISTANCE: "5"
      VIEW_DISTANCE: "6"
      # tools/tickrate: the clock runs TRAIN_SPEED times faster (the environment sets it again at its start).
      MODS: /tool/forgeaip-tickrate-1.0.0.jar
      FORGEAIP_TICKRATE: ${TRAIN_SPEED:-1}
    volumes:
      - train-data:/data
      - /mnt/data/forgeaip/mods:/mods:ro
      - ../../tools/tickrate/build/libs:/tool:ro
    ports:
      - "127.0.0.1:25567:25565"

  # The environment: N bots on the skill-level action space (src/rl/run_skill_env.js). A restart is a new run_id;
  # <base>.current tells the learner which one is live. TRAIN_SITES (scripts/train/up.sh --sites): fixed start per bot, '' = sectors.
  train-env: &trainenv_svc
    image: node@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
    profiles: [train]
    container_name: forgeaip-train-env
    restart: unless-stopped
    working_dir: /app
    mem_limit: 2g
    cpus: 2
    environment:
      MC_HOST: train
      MC_PORT: "25565"
      RCON_HOST: train
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD:?run scripts/world/up.sh}
      BOT_REGISTRY: auto
      GAME_SPEED: ${TRAIN_SPEED:-1}
    volumes:
      - ../..:/app:ro
      - ../../exchange:/exchange
    command: ["node", "src/rl/run_skill_env.js", "--base", "${TRAIN_BASE:-train}", "--bots", "${TRAIN_BOTS:-8}", "--max-steps", "${TRAIN_MAX_STEPS:-20000}", "--sites", "${TRAIN_SITES:-}", "--seed", "${TRAIN_ENV_SEED:-1}"]
    networks: [world]

  # ---- Shards 1-3 (scripts/train/up.sh --shards N): one more server + environment each, a copy of shard 0's world, no
  # host port (the owner watches shard 0). Bot ids are global (shard x bots + k); the learner follows <base>.s<i>.current.
  train-s1: &shard
    <<: *train
    profiles: [shard1]
    container_name: forgeaip-train-s1
    ports: []
    volumes:
      - train-data-s1:/data
      - /mnt/data/forgeaip/mods:/mods:ro
      - ../../tools/tickrate/build/libs:/tool:ro
  train-s2:
    <<: *shard
    profiles: [shard2]
    container_name: forgeaip-train-s2
    volumes:
      - train-data-s2:/data
      - /mnt/data/forgeaip/mods:/mods:ro
      - ../../tools/tickrate/build/libs:/tool:ro
  train-s3:
    <<: *shard
    profiles: [shard3]
    container_name: forgeaip-train-s3
    volumes:
      - train-data-s3:/data
      - /mnt/data/forgeaip/mods:/mods:ro
      - ../../tools/tickrate/build/libs:/tool:ro
  train-env-s1: &shardenv
    <<: *trainenv_svc
    profiles: [shard1]
    container_name: forgeaip-train-env-s1
    environment: &shardenvvars
      MC_HOST: train-s1
      MC_PORT: "25565"
      RCON_HOST: train-s1
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD:?run scripts/world/up.sh}
      BOT_REGISTRY: auto
      GAME_SPEED: ${TRAIN_SPEED:-1}
    command: ["node", "src/rl/run_skill_env.js", "--base", "${TRAIN_BASE:-train}", "--bots", "${TRAIN_BOTS:-8}", "--shard", "1", "--max-steps", "${TRAIN_MAX_STEPS:-20000}", "--sites", "${TRAIN_SITES:-}", "--seed", "11"]
  train-env-s2:
    <<: *shardenv
    profiles: [shard2]
    container_name: forgeaip-train-env-s2
    environment:
      <<: *shardenvvars
      MC_HOST: train-s2
      RCON_HOST: train-s2
    command: ["node", "src/rl/run_skill_env.js", "--base", "${TRAIN_BASE:-train}", "--bots", "${TRAIN_BOTS:-8}", "--shard", "2", "--max-steps", "${TRAIN_MAX_STEPS:-20000}", "--sites", "${TRAIN_SITES:-}", "--seed", "21"]
  train-env-s3:
    <<: *shardenv
    profiles: [shard3]
    container_name: forgeaip-train-env-s3
    environment:
      <<: *shardenvvars
      MC_HOST: train-s3
      RCON_HOST: train-s3
    command: ["node", "src/rl/run_skill_env.js", "--base", "${TRAIN_BASE:-train}", "--bots", "${TRAIN_BOTS:-8}", "--shard", "3", "--max-steps", "${TRAIN_MAX_STEPS:-20000}", "--sites", "${TRAIN_SITES:-}", "--seed", "31"]

  # The policy and learner: DPOD's Truck derivative on demand + asynchronous PPO with the two-stage curriculum
  # (DPOD scripts/botsystem_skill_ppo.py). Checkpoints in exchange/<base>/train; a restart resumes from the last one.
  train-policy:
    image: python:3.12-slim
    profiles: [train]
    container_name: forgeaip-train-policy
    restart: unless-stopped
    ulimits:
      core: 0              # JAX threads abort at interpreter exit; no 1 GiB core files
    mem_limit: 3200m      # GoalWM + plan: update peaks reached 2.48 GB of 2.5 with the replay rings 10 % full (run 5, 2026-11-02)
    cpus: 2
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      XLA_FLAGS: --xla_cpu_multi_thread_eigen=false intra_op_parallelism_threads=2
      TRAIN_POLICY: ${TRAIN_POLICY:-botsystem_goal_ppo.py}
      TRAIN_POLICY_INIT: ${TRAIN_POLICY_INIT:-}
      TRAIN_BASE: ${TRAIN_BASE:-train}
      TRAIN_LEARN: ${TRAIN_LEARN:-1}
      TRAIN_POLICY_SEED: ${TRAIN_POLICY_SEED:-42}
      TRAIN_POPULATION: ${TRAIN_POPULATION:-1}
    volumes:
      - rl-jaxvenv:/venv:ro
      - ${DPOD_DIR:-../../../Decision-Process-order-driven}:/dpod:ro
      - ../../exchange:/x
    # TRAIN_POLICY: botsystem_skill_ppo.py (SkillTruck) or botsystem_goal_ppo.py (GoalWM, DPOD TASK-20261101-031; scripts/train/up.sh
    # --policy); TRAIN_POLICY_INIT: the goal learner's offline-pretrained parameters (empty = none).
    command: ["sh", "-c", 'exec /venv/bin/python /dpod/scripts/"$$TRAIN_POLICY" --root /x --base "$$TRAIN_BASE" --learn "$$TRAIN_LEARN" --seed "$$TRAIN_POLICY_SEED" --population "$$TRAIN_POPULATION" $${TRAIN_POLICY_INIT:+--init "$$TRAIN_POLICY_INIT"}']
    network_mode: none

  # The watcher's page (tools/train-dash, Rust std only, read-only): what each bot is doing, what happened, success rates,
  # command bias, the learner's curves. Loopback only; scripts/train/up.sh adds the tailnet route (tailscale serve, port 3021).
  train-dash:
    image: gcr.io/distroless/cc-debian12:nonroot
    profiles: [train]
    container_name: forgeaip-train-dash
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    ports: ["127.0.0.1:3021:3021"]
    volumes:
      - ../../tools/train-dash/target/bookworm/release/train-dash:/train-dash:ro
      - ../../exchange:/x:ro
    command: ["/train-dash", "--root", "/x", "--base", "${TRAIN_BASE:-train}", "--bind", "0.0.0.0:3021"]
    networks: [dash]

volumes:
  rl-jaxvenv:
    external: true
  train-data:
  train-data-s1:
  train-data-s2:
  train-data-s3:
  data:
  test-data:
  check-logs:

networks:
  dash:
  world:
