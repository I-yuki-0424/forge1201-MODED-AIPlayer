hazards:
  - "rootwatch reboots the VPS daily inside 03:00-06:00 JST (about 03:50) and ignores the schedule: any job running then is killed and nothing restarts it. End jobs before 03:00 or hold the night with maint-hold. The Forge RL server (container forgeaip-rl-mc, restart policy, about 1.7 GiB) comes back after every reboot with no hold: stop it with scripts/rl/down.sh when idle."
  - "LFS rules on *.json/*.txt/*.log: package.json and similar become unfetchable pointers if .gitattributes regains them (no Hugging Face write credential on the VPS; objects were never pushed). See docs/LESSONS.md L1."
  - "WebUI/debug WebSocket are unauthenticated and bind 0.0.0.0: reachable by anything on the LAN, and by the internet if the host forwards the port. Docker publishes ports through its own iptables chains and bypasses ufw on a server."
  - "Node 22.23.4 breaks the FML3 host trick (BUGFIX-20261030-002): use Node 20 or 22.11 until fixed."
  - "Root-level and data/ runtime files are ignored (*.log, ai_debug_*.json, data/*.json except presets/junk list): do not commit them; they hold chat and coordinates."
  - "OLLAMA_API_KEY lives only in .env (ignored). PUT /api/config can replace it in-process: never log request bodies."
  - "Hand-edited block dictionary data/sample/configs/mod_blocks_dictionary.json (286 KB) is required by test_dynamic_registry_injector; keep it tracked as real JSON."
