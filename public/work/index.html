<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work console</title>
<link rel="stylesheet" href="/work.css">
</head>
<body>
<section id="login" class="center hidden">
  <form id="loginForm" class="panel narrow">
    <div class="panel-head"><span class="panel-title">Work console</span></div>
    <div class="panel-body stack">
      <p id="notice" class="notice hidden"></p>
      <p class="muted">Access token: the file <code>console.token</code> in the console's data folder.</p>
      <input id="token" type="password" autocomplete="off" placeholder="token" required>
      <button type="submit" class="btn primary">Sign in</button>
      <p id="loginError" class="error"></p>
    </div>
  </form>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <div class="brand"><span class="logo">W</span><span class="brand-text">Work console</span></div>
    <nav id="nav"></nav>
    <div class="side-foot muted small"><span id="srv"></span></div>
  </aside>
  <div id="main">
    <header id="top">
      <h1 id="pagetitle"></h1>
      <div id="chips" class="chips-bar"></div>
      <span class="grow"></span>
      <button id="logout" class="btn small ghost">Sign out</button>
    </header>
    <div id="page"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/blockcolor.js"></script>
<script src="/ui.js"></script>
<script src="/map.js"></script>
<script src="/cmd.js"></script>
<script src="/inv.js"></script>
<script src="/tools.js"></script>
<script src="/work.js"></script>
</body>
</html>
