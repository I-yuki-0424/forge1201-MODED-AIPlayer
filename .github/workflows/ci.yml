# Unit layer of the CI (TASK-20261125-080, docs/proposed/OWNER-LIST-5.md): every push to main and every pull request runs
# `npm test` (tests/suite.txt) and the Rust simulator's tests. The live regression suite runs on the VPS, not here:
# the repository is public, so no self-hosted runner and no secrets are used by any workflow.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, lfs: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm test
      - name: shell syntax of the live suite and test-world scripts (they run only on the VPS)
        run: for f in scripts/ci/*.sh scripts/t26/*.sh; do bash -n "$f" || exit 1; done
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: { working-directory: tools/sim }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, lfs: false }
      - run: cargo test --release
