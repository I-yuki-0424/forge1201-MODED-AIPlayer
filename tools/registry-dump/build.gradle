// Server-only tool mod: writes the block/item tables of a modded server (see RegistryDump.java). Built by
// scripts/world/registry-dump.sh in a JDK 17 container; never installed in the build world or a client.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.forgeaip.registrydump'
base { archivesName = 'forgeaip-registrydump' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft { mappings channel: 'official', version: '1.20.1' }

repositories { mavenCentral() }

dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
